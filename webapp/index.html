<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>IELTS &amp; CEFR Mock — Free Computer-Delivered Practice Test</title>
  <meta name="description" content="Free IELTS Academic and Uzbekistan Multilevel (CEFR) mock exams in a real computer-delivered layout: Listening, Reading, Writing with charts, Speaking with voice recording, and instant AI feedback." />
  <meta name="theme-color" content="#7a0c1e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <!-- Exam top bar (hidden on the home and results screens) -->
  <header id="exam-bar" class="exam-bar" hidden>
    <div class="exam-bar__left">
      <span class="logo-dot">AI</span>
      <div>
        <div id="bar-candidate" class="bar-candidate"></div>
        <div id="bar-section" class="bar-section"></div>
      </div>
    </div>
    <div class="exam-bar__center">
      <div id="bar-timer" class="timer" aria-live="polite">60:00</div>
      <div id="bar-timer-label" class="timer-label">minutes left</div>
    </div>
    <div class="exam-bar__right">
      <label id="volume-wrap" class="volume" hidden>🔊 <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" /></label>
      <button id="btn-finish-section" class="btn btn--primary btn--sm" type="button">Finish section ▸</button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- Question navigation bar (Listening / Reading / Writing) -->
  <nav id="exam-nav" class="exam-nav" hidden aria-label="Question navigation"></nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal__card">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div class="modal__actions">
        <button id="modal-cancel" class="btn btn--ghost" type="button">Cancel</button>
        <button id="modal-ok" class="btn btn--primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <audio id="listening-audio" preload="auto"></audio>

  <noscript>Please enable JavaScript to take the mock exam.</noscript>
  <!-- Legal note: Mustaqil AI baholash va tayyorgarlik vositasi — unofficial practice tool. -->
  <script src="app.js?v=6"></script>
</body>
</html>
