services:
  - type: web
    name: ielts-cefr-mock-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: RUN_BOT_POLLING_IN_WEB
        value: "true"
      - key: SECRET_KEY            # signs PDF report links — keep it secret and stable
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: IELTSuzbBot
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: DATABASE_URL          # free Neon/Supabase Postgres: keeps daily limits across restarts
        sync: false
      - key: ALLOW_DEMO_AI_FALLBACK
        value: "false"
      - key: DAILY_EXAM_LIMIT
        value: "2"
      - key: ADSGRAM_BLOCK_ID      # Telegram Mini App ads (optional)
        sync: false
      - key: ADSENSE_CLIENT_ID     # Google AdSense for the browser version (optional)
        sync: false
      - key: ADSENSE_SLOT_ID
        sync: false
